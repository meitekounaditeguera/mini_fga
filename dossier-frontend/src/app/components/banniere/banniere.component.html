<div *ngIf="message" class="banniere" [ngClass]="'banniere-' + type">
  <svg *ngIf="type === 'succes'" class="banniere-icone" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M9 12.75L11.25 15L15 9.75M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <svg *ngIf="type === 'attention'" class="banniere-icone" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 9V13M12 17H12.01M10.29 3.86L1.82 18C1.64 18.32 1.55 18.68 1.55 19.05C1.55 20.13 2.42 21 3.5 21H20.5C20.87 21 21.23 20.91 21.55 20.73C22.5 20.19 22.83 18.98 22.29 18.03L13.71 3.86C13.53 3.53 13.26 3.26 12.93 3.08C11.98 2.54 10.77 2.87 10.29 3.86Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <svg *ngIf="type === 'erreur'" class="banniere-icone" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 8V12M12 16H12.01M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <span class="banniere-message">{{ message }}</span>
</div>
