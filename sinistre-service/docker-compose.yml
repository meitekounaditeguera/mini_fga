version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: sinistre-postgres
    environment:
      POSTGRES_DB: sinistre_db
      POSTGRES_USER: sinistre_user
      POSTGRES_PASSWORD: sinistre_pwd
    ports:
      - "5433:5432"
    volumes:
      - sinistre_pgdata:/var/lib/postgresql/data

  # Kafka a besoin de Zookeeper pour fonctionner (dans cette version "classique").
  # Zookeeper garde en mémoire la config de Kafka. Tu n'auras jamais besoin
  # de le configurer toi-même, juste de le laisser tourner à côté.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: sinistre-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sinistre-kafka
    depends_on:
      - zookeeper
    ports:
      # Port utilisé par nos applications Java pour se connecter à Kafka
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  sinistre_pgdata: